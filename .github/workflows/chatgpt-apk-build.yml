name: ChatGPT APK Build

on:
  push:
    branches:
      - chatgpt/apk-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
          if sdkmanager --list | grep -q "platforms;android-36.1"; then
            sdkmanager "platforms;android-36.1"
          else
            sdkmanager "platforms;android-36"
          fi

      - name: Build Mobile FOSS debug APK
        run: ./gradlew :app:assembleMobileFossDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UFM-mobile-foss-debug-apk
          path: app/build/outputs/apk/mobile/foss/debug/*.apk
          if-no-files-found: error
